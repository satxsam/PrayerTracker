# Google Cloud Build configuration
# This file can be used with Cloud Build for CI/CD
steps:
  # Build backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/prayer-tracker-api:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/prayer-tracker-api:latest'
      - './backend'
    id: 'build-backend'

  # Build frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_URL=${_BACKEND_URL}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/prayer-tracker-frontend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/prayer-tracker-frontend:latest'
      - './frontend'
    id: 'build-frontend'

  # Deploy backend
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'prayer-tracker-api'
      - '--image=gcr.io/$PROJECT_ID/prayer-tracker-api:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=DATABASE_URL=${_DATABASE_URL}'
    id: 'deploy-backend'
    waitFor: ['build-backend']

  # Deploy frontend
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'prayer-tracker-frontend'
      - '--image=gcr.io/$PROJECT_ID/prayer-tracker-frontend:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
    id: 'deploy-frontend'
    waitFor: ['build-frontend', 'deploy-backend']

substitutions:
  _REGION: 'us-central1'
  _DATABASE_URL: 'sqlite:///./prayer_tracker.db'
  _BACKEND_URL: 'https://prayer-tracker-api-XXXX.run.app'

images:
  - 'gcr.io/$PROJECT_ID/prayer-tracker-api:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/prayer-tracker-api:latest'
  - 'gcr.io/$PROJECT_ID/prayer-tracker-frontend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/prayer-tracker-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
